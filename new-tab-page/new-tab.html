<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New tab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="new-tab.css">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
</head>
<body>
    <div class="bg__wrapper" id="bg">
        <h1 class="bg__loading-txt">Loading...</h1>
    </div>
    <div class="header__wrapper">
        
    </div>
    <form class="search__wrapper" id="search">
        <div class="search__container">
            <input class="search__input" id="search__input" autocomplete="off" placeholder="Search Google..." type="text">
            <label>
                <input type="submit" class="search__submit">
                <img src="../images/search-icon.svg" alt="search on google"/>
            </label>
            
        </div>
    </form>
    <div class="footer__wrapper">
        <p class="footer__txt">Developed by <a class="footer__link" target="_blank" href="https://isaacbarker.net">isaacbarker.net</a> | Images from <a class="footer__link" target="_blank" href="https://epic.gsfc.nasa.gov/">epic.gsfc.nasa.gov</a> | Icons from <a class="footer__link" target="_blank" href="https://fonts.google.com/">fonts.google.com</a></p>
        <p class="footer__txt" id="caption"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
